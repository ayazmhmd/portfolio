projects:
- slug: mammo-multiview-prototype
  title: Intelligent Breast Cropping and Multi-View Fusion with Finding-BI-RADS Prototype Learning for
    Mammogram Classification
  authors: A. Mehmood, M. D. A. Asif, P. Temdee, R. Mumtaz
  status: under_review
  venue: IEEE Access
  year: 2026
  group: MS thesis, NUST
  short: One encoder reads both mammographic views of a breast as a single merged image, after boundary-aware
    cropping. Two prototype memories, one for radiological findings and one for BI-RADS categories, shape
    the embedding space during training. Trained on VinDr-Mammo, tested on INbreast without fine-tuning.
  tags:
  - mammography
  - multi-view fusion
  - prototype learning
  - BI-RADS grading
  - external validation
  thumb: framework_overview.png
  links: {}
  highlights:
  - value: '0.80'
    label: binary macro-F1 on VinDr-Mammo (ConvNeXt-Base)
  - value: '0.76'
    label: macro-F1 on external INbreast, no fine-tuning
  - value: '+0.095'
    label: external F1 gain from prototypes (EfficientNet-B3)
  - value: ½
    label: the FLOPs of a dual-encoder model, ~4× the throughput
  problem: |-
    Radiologists read each breast from two views, craniocaudal (CC) and mediolateral-oblique (MLO). Most multi-view networks copy this with two encoders, one per view, and fuse the features afterwards. That doubles the parameters and compute. These models also usually learn only a binary label, although radiologists describe what they see in terms of finding types and graded BI-RADS categories.

    Fine-grained BI-RADS grading is also hard to transfer. Adjacent categories, especially 3 and 4, differ only subtly, and images vary across vendors and hospitals. I wanted to know whether a cheaper single-encoder design, plus training signals built from clinical vocabulary, would hold up on a dataset from another country and vendor.
  approach:
  - title: Boundary-aware cropping
    text: Gaussian smoothing, Otsu thresholding, 5×5 morphology and the largest connected component give
      a breast mask. A row-wise tissue-extent profile, traced from the widest row, places the upper and
      lower boundaries where the breast stops tapering (pectoral muscle, skin folds, artefacts). The crop
      uses no lesion annotations.
  - title: Merged-view input
    text: The MLO crop is flipped so that both chest walls meet in the centre, padded to the same height
      and concatenated with the CC crop. One backbone (EfficientNet-B3 or ConvNeXt-Base) then encodes
      the composite.
  - title: Finding and BI-RADS prototypes
    text: Two projection heads map features into 128-d embeddings that are pulled towards EMA-updated
      prototypes, six for finding types and five for BI-RADS 1–5. Class-specific momentum and loss weights
      protect rare classes. The prototypes are used only during training, so inference cost is unchanged.
  - title: Losses
    text: Asymmetric focal loss for the binary task, and an ordinal (CORAL-style) head with under-grading
      penalties for five-class BI-RADS. The prototype loss is warmed up over 3 epochs, then ramped to
      a maximum weight of 0.5.
  - title: Evaluation
    text: Patient-level splits on VinDr-Mammo; external test on INbreast without fine-tuning; bootstrap
      95% CIs, McNemar and DeLong tests; three-seed variability; stratified by device, density and finding
      type.
  diagram: ''
  figures:
  - file: framework_overview.png
    group: Method
    caption: Overview of the framework.
    description: Mammograms are cropped to the breast, the CC and MLO views are merged into one composite,
      and a single encoder is trained for binary and five-class BI-RADS prediction at several input resolutions.
    wide: true
  - file: preprocessing_pipeline.png
    group: Method
    caption: Preprocessing and view merging.
    description: Background removal and boundary-aware cropping give a tight breast ROI for each view.
      The MLO view is flipped horizontally and concatenated with the CC view, keeping each view's native
      aspect ratio.
  - file: cropping_steps.png
    group: Method
    caption: The cropping algorithm, step by step, on two sample CC mammograms.
    description: |-
      A re-implementation of the paper's cropping, run on two sample mammograms. Step 4 is the key idea. The tissue extent is measured on every row; starting from the widest row (orange), the profile is followed up and down while the breast keeps tapering. Where it stops tapering, a boundary is placed, plus a margin.

      In the paper, 2,239 of 2,254 annotated lesion boxes (99.3%) stayed fully inside the crop.
    wide: true
  - file: model_configurations.png
    group: Method
    caption: Merged-view single encoder (A) versus dual-encoder two-view baseline with adaptive MLO weighting
      (B).
    description: The dual-encoder baseline encodes each view separately and fuses after pooling, with
      a learned gate on the MLO branch. A shared-weight variant was also trained to separate the effect
      of early fusion from the effect of removing the duplicated backbone.
  - file: prototype_learning.png
    group: Method
    caption: Finding- and BI-RADS-aware prototype learning.
    description: The pooled feature feeds a classifier and two projection heads. Each embedding is compared
      with its prototype memory by temperature-scaled cosine similarity (τ = 0.1), pulling samples towards
      their own prototypes and away from the others.
    wide: true
  - file: study_design.png
    group: Method
    caption: Study design for testing generalisation.
    description: Models are developed on VinDr-Mammo (Vietnam, three vendors) with patient-level splits,
      and then frozen and tested on INbreast (Portugal, Siemens). LUMINA, with multi-vendor images and
      pathology labels, is used in the follow-up foundation-model paper.
    wide: true
  - file: generalization_prototypes.png
    group: Results
    caption: Prototypes give a small internal gain and a large external gain.
    description: Binary macro-F1 at 512 px. On INbreast, F1 rises from 0.658 to 0.753 (EfficientNet-B3)
      and from 0.711 to 0.758 (ConvNeXt-Base). The gain is significant on McNemar's test (p < 0.01) for
      all four model–dataset pairs.
    wide: true
  - file: ablation.png
    group: Results
    caption: 'Ablation (ConvNeXt-Base, binary): each component, internal vs external.'
    description: Removing the crop or using a single view lowers performance. Merged and shared two-view
      encoders perform similarly, so merging is mainly an efficiency gain. Finding prototypes give most
      of the external gain, and masking the MLO half at test time costs 0.065–0.157 F1.
    wide: true
  - file: efficiency.png
    group: Results
    caption: Compute and throughput at 512 px.
    description: The merged-view model has half the parameters of the dual-encoder model and half the
      FLOPs of both two-view models, with 4.3–4.4× higher throughput.
    wide: true
  - file: device_binary.png
    group: Where it works and where it fails
    caption: Binary F1 by imaging device (VinDr-Mammo test).
    description: Binary performance varies less across devices than BI-RADS grading does. EfficientNet-B3
      is weaker on Planmed Nuance.
    wide: true
  - file: device_birads.png
    group: Where it works and where it fails
    caption: Five-class BI-RADS F1 by imaging device.
    description: Fine-grained grading is more sensitive to acquisition differences (Planmed 0.36–0.47
      vs Mammomat 0.54–0.57). This motivates my current work on cross-device harmonisation.
    wide: true
  - file: density_birads.png
    group: Where it works and where it fails
    caption: Five-class BI-RADS F1 by breast density.
    description: Grading degrades from density B (0.68–0.69) to density D (0.48), where dense tissue hides
      the cues.
    wide: true
  - file: finding_recall.png
    group: Where it works and where it fails
    caption: Binary recall by radiological finding type.
    description: Calcifications are detected most reliably (0.84–0.86). Masses and structural findings
      are harder, and lymph nodes (n = 3) are too few to interpret.
    wide: true
  - file: tsne_birads.png
    group: Where it works and where it fails
    caption: t-SNE of the BI-RADS embedding; stars mark the learned prototypes.
    description: The prototypes follow the severity order. BI-RADS 3, 4 and 5 lie close together, which
      matches the low recall for the borderline categories.
  - file: gradcam_correct.jpg
    group: Where it works and where it fails
    caption: Grad-CAM on correctly detected BI-RADS ≥3 breasts.
    description: Activation falls on the lesion, in both the CC and the MLO half of the composite. Over
      all 158 BI-RADS ≥3 test breasts, 87.3% of the activation (median 91.1%) lies inside the breast.
    wide: true
  - file: gradcam_failures.jpg
    group: Where it works and where it fails
    caption: Grad-CAM on missed BI-RADS 3–4 breasts (all density C or D).
    description: The activation spreads over fibroglandular tissue and the predicted abnormality probability
      is low (0.24–0.32), matching the weaker results in dense breasts.
