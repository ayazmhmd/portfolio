- slug: mammo-adaptive-lora
  title: Adaptive LoRA Foundation Model Learning for Breast-Level Classification from Dual-View Mammography
  authors: A. Mehmood et al.
  status: ready
  venue: Manuscript
  year: 2026
  group: MS thesis, NUST
  short: MammoRLE-MIL adapts a frozen DINOv2 ViT-B/14 to mammography with routed low-rank experts on the
    attention projections and multi-head attention MIL over patch tokens. Eight configurations are compared
    on VinDr-Mammo and two external sets, INbreast and LUMINA.
  tags:
  - foundation models
  - DINOv2
  - LoRA
  - mixture of experts
  - multiple instance learning
  - external validation
  thumb: framework_overview.png
  links: {}
  highlights:
  - value: '0.878'
    label: ROC-AUC on VinDr-Mammo (MoLRE-3 + ABMIL)
  - value: '0.814'
    label: average precision on external INbreast
  - value: '+0.105'
    label: AUC over frozen DINOv2 with mean pooling (p < 0.001)
  - value: '3'
    label: datasets; the best configuration differs on each
  problem: |-
    Foundation models such as DINOv2 learn strong general features, but mammography is far from natural images. Fully fine-tuning a ViT on a few thousand breasts is costly and overfits. Abnormalities also often occupy a small part of a large image, so averaging all patch features dilutes the evidence.

    This paper asks two questions. Which matters more: how the frozen features are pooled, or how the backbone is adapted? And do gains on the development dataset survive a change of dataset and of label definition?
  approach:
  - title: Frozen DINOv2 ViT-B/14
    text: Each view is encoded at 518×518 into 1,369 patch tokens (768-d) by one encoder shared between
      the CC and MLO views.
  - title: Mixture of low-rank experts (MoLRE)
    text: K low-rank experts update the query and value projections, and a small router mixes them per
      image. Keys are untouched. The experts and router start at zero and uniform, so training begins
      from the original model.
  - title: Multi-head gated-attention MIL
    text: Several attention heads each learn a distribution over the patches. A second scoring stage weights
      the heads, giving one embedding per view.
  - title: Breast-level prediction
    text: CC and MLO embeddings are concatenated (1,536-d) and classified with asymmetric focal loss.
      The checkpoint is selected on validation AP.
  - title: Controlled study
    text: Eight configurations (E1–E8) share the data splits and the training recipe, varying only the
      pooling, the number of experts and the number of heads. External tests on INbreast (BI-RADS labels)
      and LUMINA (pathology labels) use no fine-tuning.
  diagram: ''
  figures:
  - file: framework_overview.png
    group: Method
    caption: The MammoRLE-MIL framework.
    description: Paired CC and MLO mammograms pass through a shared DINOv2 encoder with routed low-rank
      experts. Their patch tokens are pooled by multi-head MIL for each view, and the two view embeddings
      are fused for one breast-level prediction.
    wide: true
  - file: molre_module.png
    group: Method
    caption: Mixture of low-rank experts inside a frozen attention block.
    description: The router mean-pools the tokens and outputs softmax weights over K experts. Each expert
      proposes low-rank updates ΔQ and ΔV, which are mixed by the router weights and added to the frozen
      projections. K is left unchanged.
  - file: mh_mil.png
    group: Method
    caption: Multi-head gated-attention MIL.
    description: Independent gated-attention heads produce different weightings of the same patch bag.
      Learned head weights fuse them into a view-level embedding.
  - file: study_design.png
    group: Method
    caption: Train on one dataset, test frozen on two others.
    description: INbreast keeps the same BI-RADS-based label, so it tests a change of domain. LUMINA uses
      benign vs malignant pathology labels, so it changes both the domain and the endpoint.
    wide: true
  - file: vindr_forest.png
    group: Results
    caption: ROC-AUC and AP with 95% bootstrap CIs on the VinDr-Mammo test set.
    description: The large step is from mean pooling (E1) to attention MIL (E2, E3). MoLRE adds a further
      gain. E4 has the best AUC and E8 the best AP.
  - file: cross_dataset_auc.png
    group: Results
    caption: ROC-AUC of all eight configurations on the three datasets.
    description: The ranking changes. E3 is best on INbreast, and E5 and E7 are best on LUMINA, although
      neither is best internally.
    wide: true
  - file: roc_curves.png
    group: Results
    caption: ROC curves on VinDr-Mammo, INbreast and LUMINA.
    description: Same colour per model in all panels. On LUMINA the curves bunch together and their order
      changes.
  - file: sensitivity.png
    group: Results
    caption: More experts or more heads is not monotonically better.
    description: With two MIL heads, going from 2 to 3 to 4 experts lowers AUC (0.866 → 0.860 → 0.846).
      With three experts, the number of heads trades AUC against AP.
    wide: true
  - file: subgroups.png
    group: Analysis
    caption: ROC-AUC by breast density and by manufacturer.
    description: Performance is lower in density D (best 0.797) than in density C (best 0.873). The small
      IMS subgroups (n = 20 and 58) should be read with caution.
    wide: true
  - file: delong.png
    group: Analysis
    caption: Pairwise DeLong tests and improvement over the frozen baseline.
    description: Every variant beats E1 (p < 0.001), but the strongest variants are mostly not significantly
      different from each other, so I report a trade-off rather than one best model.
    wide: true
