research_interests:
  title: Research interests
  intro:
  - 'Most of my research so far is in medical imaging: breast-level mammogram classification with multi-view
    fusion and prototype learning, adapting the DINOv2 foundation model with routed low-rank experts,
    virtual staining of pathology slides with flow matching, and clinical risk models on longitudinal
    health records. Across that work I kept meeting the same obstacles. Models lose accuracy on a new
    scanner or site, labelled data is scarce for the cases that matter most, and the strongest models
    are too large for the hardware most hospitals have.'
  - For my PhD I want to work on these obstacles more broadly, with medical imaging as my home ground
    but not my only one. I am especially interested in vision-language models (including video), large
    and small language models, multimodal learning, and making all of these work in low-resource and low-data
    settings through domain adaptation, synthetic data, quantization and distillation.
  areas:
  - title: Vision-language models, including video
    text: Grounded image and video understanding, report generation, and efficient handling of many frames.
    experience: Fine-tuned BLIP and CLIP for chest X-ray report generation.
  - title: Large and small language models
    text: Parameter-efficient fine-tuning, unlearning, and compact models that run on modest hardware.
    experience: QLoRA fine-tuning of Llama 2/3, Mistral and Falcon for Urdu; SemEval-2025 LLM unlearning;
      RAG systems.
  - title: Multimodal learning
    text: Combining images, text, clinical records and other sensors, robust to missing modalities.
    experience: Dual-view image fusion; EHR, longitudinal and insurance data at Klarity.
  - title: Low-resource and low-data modelling
    text: Learning from few labels, little compute and under-served languages.
    experience: LoRA experts on a frozen DINOv2; prototypes for rare BI-RADS classes; Urdu summarisation.
  - title: Quantization and knowledge distillation
    text: Compressing models without losing accuracy, calibration or worst-case performance.
    experience: 4-bit quantized fine-tuning (QLoRA); parameter-efficient adaptation.
  - title: Domain adaptation and robustness
    text: Keeping performance when the scanner, site, sensor or conditions change.
    experience: External validation and per-device analysis in both mammography papers; device unlearning;
      harmonisation.
  - title: Generative models and synthetic data
    text: Flow matching and diffusion for 2D and 3D data that is faithful, not just realistic.
    experience: H&E-to-IHC virtual staining with flow matching; latent-diffusion inpainting; Stable Diffusion
      and Flux.
  - title: Applications
    text: Medical imaging first (mammography, pathology, chest X-ray, brain MRI), and also remote sensing,
      security and autonomous driving, which share the same problems.
    experience: Medical imaging since 2022 at NCAI, NUST and Klarity.
  topics:
  - id: domain-adaptation
    title: 'Source-free and test-time domain adaptation across scanners and sensors: from multi-vendor
      mammography to autonomous driving'
    abstract: 'Medical imaging models are trained on data from a few scanners and deployed on others.
      In my IEEE Access study, five-class BI-RADS macro-F1 was 0.36–0.47 on one mammography vendor and
      0.54–0.57 on another, and in my foundation-model study the best of eight models changed across three
      datasets. Autonomous driving faces the same problem with weather, cities and sensors, and has developed
      a rich toolbox: adversarial entropy minimisation (ADVENT), transformer self-training (DAFormer),
      and test-time adaptation that updates a model during deployment without source data (TENT, CoTTA).
      Work on domain adaptation for mammography is much younger. This project would bring these methods
      to breast-level, dual-view mammography, where adaptation is harder: lesions are tiny, classes are
      extremely imbalanced, and adaptation must not erase the rare abnormal cases. I propose source-free
      and test-time adaptation that updates only normalisation layers or low-rank adapters, anchored by
      class prototypes (from my prototype-learning work) to prevent collapse onto the majority class.
      It would be combined with image harmonisation and evaluated leave-one-vendor-out on public mammography
      datasets (VinDr-Mammo, INbreast, CMMD, LUMINA), reporting worst-vendor performance and calibration.
      As a test of generality, the same method would be applied to a driving benchmark with adverse-weather
      shift.'
    keywords:
    - unsupervised domain adaptation
    - test-time adaptation
    - mammography
    - autonomous driving
    builds_on: External validation and per-device analysis in both mammography papers; device unlearning
      (ongoing).
    refs:
    - advent
    - daformer
    - tent
    - cotta
    - uda_norway
    - uda_calc
    - wilds
  - id: synthetic-data
    title: Structure-preserving synthetic data in 2D and 3D with flow matching
    abstract: 'Synthetic data can cover rare findings and new domains, but only if it is faithful to the
      anatomy. My attempt at lesion synthesis on VinDr-Mammo with LoRA-adapted latent-diffusion inpainting
      did not improve downstream performance: natural-image priors favour seamless blending over diagnostically
      faithful structure. Flow matching and rectified flow learn straighter transport between distributions,
      sample in few steps, and are now used for 3D medical volumes (MAISI-v2). I currently use flow matching
      for H&E-to-IHC virtual staining, with results above the baseline. This project would develop conditional
      flow-matching generators with structural constraints (masks, frequency-domain losses, anatomical
      priors) for 2D data (mammography, pathology, chest X-ray) and 3D data (brain MRI, as in my tumour
      and Alzheimer''s projects, CT volumes and breast tomosynthesis), working in a learned latent space
      to keep 3D generation affordable. Two uses are studied: augmenting rare classes, and translating
      images into the style of an unseen scanner as a bridge for domain adaptation (topic 1). Synthetic
      data would be judged by what matters, namely downstream performance on external data, together with
      expert realism ratings and tests for memorisation of training images.'
    keywords:
    - flow matching
    - rectified flow
    - 3D generation
    - virtual staining
    - data augmentation
    builds_on: H&E-to-IHC virtual staining (ongoing); the negative result with latent-diffusion inpainting.
    refs:
    - lipman
    - rectflow
    - fm_med
    - maisi
    - maisi2
  - id: lossless-quantization
    title: Towards lossless quantization of medical vision and vision-language models
    abstract: 'Post-training quantization (GPTQ, AWQ) and outlier-aware schemes such as SpQR compress
      large models to 3–4 bits with near-lossless perplexity. In medicine, ''no loss'' must mean more
      than unchanged average accuracy. Decisions depend on calibrated confidence and on the rare, hard
      subgroups, and recent work shows that quantization changes calibration in vision-language models.
      This project would define lossless operationally: no statistically significant change in accuracy,
      calibration error, worst-subgroup performance or hallucination rate. It would then search for compression
      that meets this definition. Planned methods include sensitivity-guided mixed precision that keeps
      the most sensitive weights (often in the vision encoder and cross-modal projector) at higher precision;
      calibration-aware objectives during quantization; and a short low-rank recovery step in the spirit
      of QLoRA, which I have used for Urdu summarisation. Models range from mammography classifiers to
      medical VLMs and small language models, measured on CPU and edge hardware for latency and memory.
      The output is both a method and an open evaluation protocol for clinical compression.'
    keywords:
    - post-training quantization
    - mixed precision
    - calibration
    - edge deployment
    builds_on: QLoRA 4-bit fine-tuning of Llama, Mistral and Falcon; calibration (ECE) analysis in my
      mammography work.
    refs:
    - gptq
    - awq
    - spqr
    - qlora
    - quant_reliab
  - id: ensemble-distillation
    title: 'Ensemble foundation-model distillation: one compact student that beats its teachers where
      it matters'
    abstract: No single foundation model is best everywhere. In my MammoRLE-MIL study, the configuration
      with the best internal AUC was not the best on INbreast or LUMINA. General models (DINOv2, CLIP-style
      encoders, SAM) and domain-specific medical models each capture different evidence. Ensembles of
      them are accurate and better calibrated, but far too expensive to deploy. Multi-teacher distillation
      offers a way out. AM-RADIO distils CLIP, DINOv2 and SAM into a single backbone, and Pathryoshka
      compresses several pathology foundation models into a student 86–92% smaller that matches them.
      This project would distil an ensemble of general and medical foundation models into one compact
      student for medical imaging. A per-sample router, related to the routed low-rank experts I used
      in MammoRLE-MIL, weights each teacher by its reliability on that input. The student is trained to
      reproduce not only the teachers' features and predictions but also their disagreement, as a signal
      for uncertainty and calibration. The student would then be quantized (topic 3) and tested internally,
      externally and per subgroup. The aim is a model that is smaller than any teacher, while matching
      or beating the ensemble on worst-domain performance.
    keywords:
    - knowledge distillation
    - multi-teacher
    - foundation models
    - ensembles
    - calibration
    builds_on: 'MammoRLE-MIL: routed low-rank experts on DINOv2, evaluated on three datasets.'
    refs:
    - kd
    - radio
    - pathryoshka
    - dinov2
  - id: small-vlms
    title: Small, grounded vision-language models for medical images and video
    abstract: 'Medical VLMs such as LLaVA-Med and MedGemma show that one model can answer questions and
      draft reports across imaging modalities, but they are large. Video makes this harder, because the
      cost of video VLMs such as Video-ChatGPT grows with the number of frames. Training-free token compression
      (DyCoke) and small language models that run on a phone (Phi-3) suggest a different design point:
      a compact VLM that keeps only the visual evidence it needs. This project would build such models
      by distilling a large medical VLM teacher into a small language model with compressed visual tokens,
      using distillation objectives designed for generative models (MiniLLM). Target tasks are image-level
      (findings and report drafting for mammography and chest X-ray) and video-level, such as ultrasound
      and endoscopy clips. The focus is on grounding: answers must point to the image region or video
      segment that supports them, and the model should defer when unsure. Hallucination, grounding accuracy
      and calibration are measured alongside task accuracy, including for reports in low-resource languages
      such as Urdu.'
    keywords:
    - vision-language models
    - video VLMs
    - small language models
    - token compression
    - grounding
    builds_on: BLIP and CLIP report generation for chest X-rays; QLoRA LLM fine-tuning for Urdu; LLM unlearning.
    refs:
    - llavamed
    - medgemma
    - videochatgpt
    - dycoke
    - phi3
    - minillm
