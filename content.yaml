  results_note: ''
  details: |-
    ### What I took away
    - **Merging views is mainly an efficiency win.** The merged model matches a parameter-matched shared two-view encoder at half the compute.
    - **Clinical structure in training helps transfer.** The prototypes add little on the training distribution but a lot on an external dataset. The effect is larger than the seed-to-seed variation (SD 0.006 macro-F1 over three seeds).
    - **Fine-grained grading is the open problem.** BI-RADS 3 and 4 recall stays at 0.16–0.40, and 39–45 of the 91 VinDr BI-RADS 4–5 breasts are graded as 1 or 2. On INbreast, wrong predictions are often *more* confident than correct ones.

    ### Limitations
    External validation uses one small single-institution set (INbreast, 187 breasts). Merging halves each view's horizontal resolution, which may hurt calcification grading. Asymmetries, which need all four views, were excluded.
  contribution: First author. I designed the method, wrote the code, ran all experiments and statistical
    tests, and wrote the manuscript, under the supervision of Dr. M. Daud Abdullah Asif.
