      - '0.751'
    - - E3
      - MH-MIL (2 heads)
      - '0.855'
      - '0.580'
      - '0.876'
      - '0.814'
      - '0.710'
      - '0.736'
    - - E4
      - MoLRE-3 + ABMIL
      - '0.878'
      - '0.606'
      - '0.868'
      - '0.803'
      - '0.709'
      - '0.737'
    - - E5
      - MoLRE-3 + MH-MIL-2
      - '0.860'
      - '0.582'
      - '0.844'
      - '0.764'
      - '0.752'
      - '0.769'
    - - E6
      - MoLRE-2 + MH-MIL-2
      - '0.866'
      - '0.590'
      - '0.865'
      - '0.784'
      - '0.722'
      - '0.751'
    - - E7
      - MoLRE-4 + MH-MIL-2
      - '0.846'
      - '0.571'
      - '0.859'
      - '0.796'
      - '0.748'
      - '0.768'
    - - E8
      - MoLRE-3 + MH-MIL-3
      - '0.870'
      - '0.608'
      - '0.873'
      - '0.814'
      - '0.715'
      - '0.743'
  results_note: ''
  details: |-
    ### What I took away
    - **Pooling matters more than adaptation at first.** Replacing mean pooling with attention MIL gives the largest single gain (+0.072 AUC, +0.143 AP). Adapting the backbone with MoLRE adds a smaller, complementary gain (E2 → E4: +0.033 AUC, p = 0.014).
    - **Capacity is not a free lunch.** More experts or more heads did not help consistently, and the strongest variants are not significantly different from one another.
    - **Rankings move under shift.** INbreast, which shares the label definition, keeps strong performance (best AUC 0.876, AP 0.814). LUMINA changes both the vendor mix and the endpoint, so AUC drops to about 0.75, and a different configuration comes out on top.

    ### Limitations
    The pairwise tests are not corrected for multiple comparisons. The two smallest device subgroups are too small for firm conclusions. LUMINA's pathology endpoint differs from the BI-RADS-based training label.
  contribution: First author. I designed and implemented the framework, ran the experiments and the statistical
    analysis, and wrote the manuscript.
