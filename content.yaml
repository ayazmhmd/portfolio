proposal:
  title: Robust, data-efficient and deployable vision and multimodal models
  status: This is a draft. I'm happy to shape it around the direction of the group I join.
  pdf: ''
  sections:
  - heading: Motivation
    text: Vision models are usually trained on one dataset and reported on its test split, then deployed
      on different sensors, sites and conditions. In my medical imaging experiments, the same models lost
      accuracy on another vendor, in harder subgroups and on rare categories, and the best model changed
      with the dataset. The same failure modes limit remote sensing, security and autonomous systems,
      and the settings with the least data and hardware are the least served.
  - heading: Aim
    text: To develop and evaluate methods that keep vision and vision-language models accurate and calibrated
      under domain shift and data scarcity, using multimodal and temporal information, and to compress
      them for edge deployment without measurable loss. Medical imaging is the primary testbed, with transfer
      to remote sensing or autonomous driving.
  - heading: Research questions
    list:
    - Can harmonisation or domain-invariant representations remove sensor and site effects without removing
      task-relevant detail?
    - Can flow-matching generators produce faithful 2D and 3D data that improves performance on rare classes
      and new domains?
    - How much do multimodal and temporal information add, and how robust is that gain to missing data?
    - Do tool-using VLM agents stay grounded and calibrated under shift, and can they be quantized or
      distilled without loss?
  - heading: Plan
    list:
    - 'Year 1: multi-domain benchmark with worst-domain reporting; harmonisation versus representation-level
      unlearning (medical first, then satellite imagery).'
    - 'Year 2: 2D and 3D flow-matching synthesis with structural constraints; few-label learning curves
      combining PEFT, prototypes and synthetic data.'
    - 'Year 3: multimodal and temporal models; VLM agents and their quantized and distilled versions,
      evaluated beyond accuracy on edge hardware.'
  - heading: Expected outcomes
    list:
    - Open benchmarks and evaluation protocols that report worst-subgroup and external performance.
    - Harmonisation and generation methods validated on downstream clinical tasks, not only image similarity.
    - Compressed medical models that run on modest hardware with documented, measured trade-offs.
research_direction:
  title: Vision and multimodal AI that holds up outside the lab
  intro: 'Models trained on one dataset are increasingly deployed somewhere else: a different hospital
    scanner, a different satellite sensor or season, a different camera, city or weather. In my own medical
    imaging work I saw what happens then. Accuracy dropped on a new device and on the hardest cases, the
    best model changed when the dataset changed, and the rare cases had the least data. These problems
    are not specific to mammography. They also hold back remote sensing, security and surveillance, and
    autonomous driving. I want my PhD to address them generally: models that are robust to domain shift,
    that learn from synthetic and scarce data, that use several modalities over time, and that are small
    and reliable enough to run on real devices, including as the perception layer of agentic AI systems.'
  domains:
  - name: Medical imaging
    text: scanner and site shift, rare findings, 2D and 3D scans, prior exams and patient records
  - name: Remote sensing
    text: sensor, season and region shift, optical and SAR fusion, satellite time series, few labels
  - name: Security and surveillance
    text: camera, lighting and viewpoint shift, rare events, privacy-preserving on-device models
  - name: Autonomous systems
    text: weather and city shift, camera and LiDAR fusion, 3D scenes, real-time edge inference
  pipeline:
  - stage: Data
    items:
    - Harmonise across sensors, sites and conditions
    - Generate 2D and 3D data with flow matching
    - Learn from few labels
  - stage: Modelling
    items:
    - Fuse images, text, records and other sensors
    - Model change over time (prior exams, image time series, video)
  - stage: Deployment
    items:
    - Vision-language models and agents
    - Near-lossless quantization and distillation
    - Report worst-case performance, not just averages
  themes:
  - id: harmonisation
    title: Domain shift and harmonisation
    summary: The same scene should get the same answer, whichever scanner, satellite, camera or site captured
      it.
    why: In my IEEE Access study, five-class BI-RADS F1 was 0.36–0.47 on one mammography vendor and 0.54–0.57
      on another. In my foundation-model study, the ranking of eight models changed across three datasets.
      Benchmarks such as WILDS show the same pattern across very different fields, including satellite
      imagery.
    questions:
    - When is it better to harmonise the input images, and when to make the learned representation invariant
      (for example by unlearning sensor or site information)?
    - Can harmonisation remove acquisition style without removing fine diagnostic or semantic detail?
    - 'Which evaluation actually predicts deployment performance: image similarity, average accuracy,
      or worst-domain accuracy?'
    approach:
    - 'Multi-domain benchmarks with held-out sensors or sites: mammography vendors first, then satellite
      sensors and regions.'
    - Compare disentanglement-based harmonisation (in the style of HACA3), flow-matching image translation
      and representation-level unlearning.
    - Report the gap between the best and worst domain, with calibration alongside accuracy.
    status: 'Started: harmonisation models beat the unharmonised baseline on mammography, and device unlearning
      is implemented.'
    refs:
    - wilds
    - haca3
  - id: synthesis
    title: Synthetic data in 2D and 3D with flow matching
    summary: Generate faithful images, volumes and scenes to cover rare cases and to stress-test models
      before deployment.
    why: My lesion-synthesis experiment with latent-diffusion inpainting did not help downstream performance,
      because natural-image priors produce plausible-looking rather than faithful structure. That led
      me to flow matching, which learns straighter transport paths and samples in far fewer steps. I now
      use it for virtual staining of pathology slides. 3D generators such as MAISI-v2 are adopting rectified
      flow for the same reasons.
    questions:
    - Can structural constraints (frequency-domain, masks, geometry) make generated data faithful enough
      to train on?
    - Does latent flow matching scale to 3D medical volumes, multi-band satellite imagery and 3D driving
      scenes at practical cost?
    - When does synthetic data help, and how do we detect when it teaches shortcuts or memorises training
      data?
    approach:
    - Conditional flow matching in 2D (mammography, pathology, satellite tiles) with structural constraints.
    - Latent rectified-flow models for 3D volumes and scenes, building on open frameworks such as MAISI.
    - Judge synthetic data by downstream performance on held-out domains, plus memorisation tests.
    status: 'Ongoing: H&E-to-IHC virtual staining with flow matching, currently above the baseline.'
    refs:
    - lipman
    - rectflow
    - fm_med
    - maisi
    - maisi2
  - id: lowsample
    title: Learning from few samples
    summary: Rare findings, rare events and new deployment sites should not need thousands of new labels.
    why: In VinDr-Mammo, the most severe category has 83 training breasts against 4,824 normal ones. Clinically
      grounded prototypes improved external macro-F1 by up to 0.095, and a frozen DINOv2 with a few routed
      LoRA experts reached 0.878 AUC while training a small fraction of the parameters. Foundation models
      for Earth observation, such as Prithvi and SatMAE, raise the same question for remote sensing.
    questions:
    - How few labels are needed when a foundation model is adapted with parameter-efficient methods and
      domain structure (prototypes, ordinal labels)?
    - Can synthetic data replace or complement real examples of rare classes, and by how much?
    - Can a model adapt to a new site or sensor from a handful of unlabelled images?
    approach:
    - Learning curves from 1% to 100% of labels, comparing PEFT, prototype learning and synthetic augmentation
      on the same splits.
    - Few-shot adaptation to held-out domains from theme 1, in medical and satellite imagery.
    status: Builds directly on both of my mammography papers.
    refs:
    - dinov2
    - lora
    - satmae
    - prithvi
  - id: multimodal
    title: Multimodal and temporal modelling
    summary: Combine everything available, including images, text, records and other sensors, and how
      it changes over time.
    why: At Klarity I model longitudinal EHR data with irregular follow-up, while my imaging models see
      only pixels at one time point. Radiologists compare with prior exams; remote sensing relies on time
      series and on optical and SAR fusion; driving relies on camera, LiDAR and radar. Risk models such
      as Mirai still predict from a single exam.
    questions:
    - How should images be fused with other modalities that are irregular, missing or misaligned?
    - Does explicitly modelling change over time (prior exams, satellite time series, video) beat treating
      each time point separately?
    - Can the model tell us which modality and which time point drove the decision?
    approach:
    - Cross-attention fusion that is robust to missing modalities, tested on image and EHR data and on
      multi-sensor data (nuScenes-style camera and LiDAR).
    - Time-aware models for change detection, with irregular time gaps handled explicitly.
    status: Planned. It connects my imaging thesis with my longitudinal EHR work.
    refs:
    - mirai
    - nuscenes
  - id: vlm-agents
    title: Vision-language models and agentic AI
    summary: Use VLMs not only to describe images but as the perception and reasoning core of agents that
      plan, use tools and check themselves.
    why: 'VLMs are moving into every one of these domains: LLaVA-Med and MedGemma in medicine, DriveLM
      in autonomous driving, and geospatial assistants in remote sensing. Agent frameworks such as ReAct
      let a model reason, call tools (a segmenter, a detector, a database) and act on the results. I have
      fine-tuned BLIP and CLIP for report generation and worked on LLM unlearning. What is missing is
      evidence that these systems stay grounded and calibrated under the domain shifts in theme 1.'
    questions:
    - Does a VLM agent that calls specialised vision tools (detection, segmentation, change detection)
      beat a single end-to-end VLM, and is it more robust to shift?
    - How can an agent know when it is out of distribution and should defer to a human?
    - How do we measure hallucination and grounding in images, not only in text?
    approach:
    - Tool-using VLM agents for structured image analysis, such as screening triage and satellite change
      reports, evaluated on held-out domains.
    - Uncertainty-aware deferral, with evaluation of grounding and hallucination.
    status: Planned. It builds on my VLM fine-tuning and LLM work.
    refs:
    - llavamed
    - medgemma
    - drivelm
    - react
  - id: efficient
    title: 'Small models: quantization and knowledge distillation without loss'
    summary: 'Run VLMs and small language models on the hardware that is actually available: hospital
      workstations, drones, vehicles and cameras.'
    why: The strongest VLMs are large, while many deployments are on edge devices or in low-resource settings.
      I have fine-tuned quantized LLMs with QLoRA for Urdu summarisation. Compression is usually reported
      as an accuracy drop, but recent work shows that quantization also changes calibration, which matters
      whenever a model's confidence drives a decision.
    questions:
    - What should lossless mean? I would define it as no significant change in accuracy, calibration,
      worst-domain performance or hallucination rate.
    - Which combination of post-training quantization (GPTQ, AWQ, 8-bit and 4-bit) and knowledge distillation
      into small vision-language or language models meets that bar?
    - Can distillation transfer the teacher's uncertainty and grounding, not only its answers?
    approach:
    - A benchmark of quantized and distilled VLMs and SLMs, measured beyond accuracy, in medical and non-medical
      domains.
    - Calibration- and domain-aware quantization, and distillation objectives that match the teacher's
      uncertainty.
    - Latency and memory tests on CPU and edge hardware.
    status: Planned. It builds on my QLoRA and LLM-unlearning work.
    refs:
    - gptq
    - awq
    - qlora
    - kd
    - quant_reliab
  principles:
  - Report worst-domain and external performance next to averages, with confidence intervals.
  - Report negative results, such as my inpainting experiment, as findings.
  - Release code and evaluation protocols so that results can be checked.
